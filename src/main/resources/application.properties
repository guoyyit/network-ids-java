spring.application.name=network-ids-java

# ---- Local IDS engine configuration (ids.*) ----
# Maximum number of tracked TCP flows.
ids.max-flows=10000
# Idle flows older than this (ms, by packet timestamp) are reclaimed.
ids.idle-timeout-ms=600000
# Closed/TIME_WAIT flows are reclaimed after this shorter timeout (ms).
ids.closed-timeout-ms=30000
# Maximum bytes buffered per flow-direction waiting to fill sequence gaps.
ids.max-buffered-bytes-per-direction=1048576
# Alert aggregation window (ms), half-open [first, first+window).
ids.aggregation-window-ms=60000
# Bytes of context retained on each side of a content match.
ids.context-radius=32
# A durable snapshot is taken every N committed packets.
ids.snapshot-interval=1024
# Directory for commit log, delivery marker and snapshots.
ids.checkpoint-dir=data/ids
# Enable crash recovery persistence.
ids.persistence-enabled=true
